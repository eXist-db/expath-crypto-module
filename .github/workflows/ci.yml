name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: ['21']
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven

      # The published 7.0.0-SNAPSHOT at repo.exist-db.org is stale (predates
      # the Type.ATOMIC -> Type.ANY_ATOMIC_TYPE rename and other recent API
      # changes). Sister org repos (e.g. eXist-db/exist-http-client) work
      # around this by extracting exist.uber.jar from the official Docker
      # image and installing it locally as 7.0.0-SNAPSHOT. Remove once the
      # maven snapshot publication pipeline is restored.
      - name: Pull eXist-db image
        run: docker pull existdb/existdb:latest

      - name: Install exist-core from Docker image into local Maven repo
        run: |
          id=$(docker create existdb/existdb:latest)
          docker cp "$id:/exist/lib/exist.uber.jar" /tmp/exist.uber.jar
          docker rm "$id"
          mvn install:install-file -Dfile=/tmp/exist.uber.jar \
            -DgroupId=org.exist-db -DartifactId=exist-core \
            -Dversion=7.0.0-SNAPSHOT -Dpackaging=jar -q

      - name: Maven Build
        run: mvn -V -B -DskipTests=true install

      - name: Maven Test
        run: mvn -B verify
